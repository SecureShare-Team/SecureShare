apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureshare-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureshare-backend
  template:
    metadata:
      labels:
        app: secureshare-backend
    spec:
      containers:
      - name: backend
        image: secureshare:backend-latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: production
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: db-host
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
